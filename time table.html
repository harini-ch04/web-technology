<!DOCTYPE html>
<html>
<head>
    <title>Class Timetable</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        table {
            width: 90%;
            margin: 20px auto;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #555;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #4CAF50;
            color: white;
        }

        tr:nth-child(even) {
            background: #f9f9f9;
        }

        .break {
            background: #ffcc80;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Weekly Class Timetable</h1>

    <table>
        <tr>
            <th>Time</th>
            <th>Monday</th>
            <th>Tuesday</th>
            <th>Wednesday</th>
            <th>Thursday</th>
            <th>Friday</th>
        </tr>

        <tr>
            <td>9:00 - 10:00</td>
            <td>Maths</td>
            <td>Science</td>
            <td>English</td>
            <td>Maths</td>
            <td>Computer</td>
        </tr>

        <tr>
            <td>10:00 - 11:00</td>
            <td>English</td>
            <td>Maths</td>
            <td>Computer</td>
            <td>Science</td>
            <td>English</td>
        </tr>

        <tr class="break">
            <td>11:00 - 11:30</td>
            <td colspan="5">BREAK</td>
        </tr>

        <tr>
            <td>11:30 - 12:30</td>
            <td>Computer</td>
            <td>English</td>
            <td>Maths</td>
            <td>Computer</td>
            <td>Science</td>
        </tr>

        <tr>
            <td>12:30 - 1:30</td>
            <td>Science</td>
            <td>Computer</td>
            <td>Science</td>
            <td>English</td>
            <td>Maths</td>
        </tr>

    </table>

</body>
</html>
